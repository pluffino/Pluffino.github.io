<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluffino Studio - Create Article</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="creator-container">

    <h1>🚀 Pluffino Studio</h1>

    <p class="subtitle">
        Create a brand new article for Pluffino Gaming Hub
    </p>
<div class="progress-container">

    <div class="progress-step active">
        <div class="circle">1</div>
        <span>Basic Info</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">2</div>
        <span>Write</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">3</div>
        <span>Ratings</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">4</div>
        <span>Preview</span>
    </div>

</div>
    <div class="step-box">

        <h2>Step 1 • Basic Information</h2>

        <label>🖼 Thumbnail</label>
        <input type="file">

        <label>📝 Article Title</label>
        <input type="text" placeholder="Example: Lokicraft 7 Review">

        <label>🎮 Game Name</label>
        <input type="text" placeholder="Lokicraft 7">

        <label>📂 Category</label>

        <select>

            <option>Crafting & Building</option>
            <option>Craftsman</option>
            <option>Lokicraft</option>
            <option>Minecraft</option>
            <option>Other Minecraft Likes</option>

        </select>

        <label>📱 Device Tested</label>
        <input type="text" placeholder="Samsung Galaxy A15">

        <label>📲 Android / iOS Version</label>
        <input type="text" placeholder="Android 15">

        <label>🎮 Game Version</label>
        <input type="text" placeholder="Version 7.0">

        <label>▶ YouTube Video Link</label>
        <input type="url" placeholder="https://youtube.com/...">

        <button class="next-btn">
            Next →
        </button>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluffino Studio - Create Article</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="creator-container">

    <h1>🚀 Pluffino Studio</h1>

    <p class="subtitle">
        Create a brand new article for Pluffino Gaming Hub
    </p>
<div class="progress-container">

    <div class="progress-step active">
        <div class="circle">1</div>
        <span>Basic Info</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">2</div>
        <span>Write</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">3</div>
        <span>Ratings</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">4</div>
        <span>Preview</span>
    </div>

</div>
    <div class="step-box">

        <h2>Step 1 • Basic Information</h2>

        <label>🖼 Thumbnail</label>
        <input type="file">

        <label>📝 Article Title</label>
        <input type="text" placeholder="Example: Lokicraft 7 Review">

        <label>🎮 Game Name</label>
        <input type="text" placeholder="Lokicraft 7">

        <label>📂 Category</label>

        <select>

            <option>Crafting & Building</option>
            <option>Craftsman</option>
            <option>Lokicraft</option>
            <option>Minecraft</option>
            <option>Other Minecraft Likes</option>

        </select>

        <label>📱 Device (Optional)</label>
        <input type="text" placeholder="Samsung Galaxy A15">

        <label>▶ YouTube Video Link</label>
        <input type="url" placeholder="https://youtube.com/...">

        <h2>Step 2 • Content</h2>

<label>📂 Subject</label>

<select>

<option>Review</option>

<option>Gameplay</option>

<option>Tutorial</option>

<option>Tips & Tricks</option>

<option>Challenge</option>

<option>Speedrun</option>

<option>Crate Opening</option>

<option>Bugs & Glitches</option>

<option>Comparison</option>

<option>News</option>

<option>Update</option>

<option>Other</option>

</select>

<label>✍ Describe It</label>

<textarea
placeholder="Tell readers what happened in your video.

• What did you do?
• What did you discover?
• Did something funny happen?
• What should players know?">
</textarea>

<div class="buttons">

<button class="back-btn">
← Back
</button>

<button class="next-btn">
Next →
</button>

</div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluffino Studio</title>

<link rel="stylesheet" href="create-article.css">

</head>

<body>

<div class="creator-container">

<header class="creator-header">

<img
src="Picsart_26-04-04_09-01-51-589.png"
class="creator-logo"
alt="Pluffino"
>

<h1>Pluffino Studio</h1>

<p>Create and publish your gaming article</p>

</header>


<!-- =========================================================
     PROGRESS BAR
     ========================================================= -->

<div class="progress-container">

<div class="progress-step active">
Basic Info
</div>

<div class="progress-step">
Content
</div>

<div class="progress-step">
Details
</div>

<div class="progress-step">
Publish
</div>

</div>


<!-- =========================================================
     STEP 1
     ========================================================= -->

<section class="step active" id="step1">

<h2>Step 1 • Basic Information</h2>

<label for="articleTitle">
Article Title
</label>

<input
type="text"
id="articleTitle"
placeholder="Enter your article title"
>


<label for="gameName">
Game Name
</label>

<input
type="text"
id="gameName"
placeholder="Enter the game name"
>


<label for="category">
Category
</label>

<select id="category">

<option value="">
Select a category
</option>

<option value="Action">
Action
</option>

<option value="Survival">
Survival
</option>

<option value="Horror">
Horror
</option>

<option value="Adventure">
Adventure
</option>

<option value="Battle Royale">
Battle Royale
</option>

<option value="Other">
Other
</option>

</select>


<label for="thumbnail">
Thumbnail
</label>

<input
type="file"
id="thumbnail"
accept="image/*"
>


<label for="videoLink">
YouTube / Video Link
</label>

<input
type="url"
id="videoLink"
placeholder="https://youtube.com/..."
>


<div class="button-row">

<button
type="button"
class="next-btn"
onclick="nextStep()"
>
Next →
</button>

</div>

</section>


<!-- =========================================================
     STEP 2
     ========================================================= -->

<section class="step" id="step2">

<h2>Step 2 • Content</h2>


<label for="subject">
Subject
</label>

<select id="subject">

<option value="">
Select a subject
</option>

<option value="Gameplay">
Gameplay
</option>

<option value="Review">
Review
</option>

<option value="Opening Crates">
Opening Crates
</option>

<option value="Showing Bugs">
Showing Bugs
</option>

<option value="Other">
Other
</option>

</select>


<label for="story">
Describe it
</label>

<textarea
id="story"
rows="12"
placeholder="Tell readers what happened..."
></textarea>


<div class="button-row">

<button
type="button"
class="back-btn"
onclick="previousStep()"
>
← Back
</button>

<button
type="button"
class="next-btn"
onclick="goToStep3()"
>
Next →
</button>

</div>

</section>


<!-- =========================================================
     STEP 3
     ========================================================= -->

<section class="step" id="step3">

<h2>Step 3 • Details</h2>


<label for="device">
Device
</label>

<input
type="text"
id="device"
placeholder="Optional"
>


<div class="review-toggle">

<label>

<input
type="checkbox"
id="reviewMode"
onchange="toggleReview()"
>

This is a review

</label>

</div>


<div
id="reviewSection"
style="display:none;"
>


<label for="rating">
Rating
</label>

<select id="rating">

<option value="">
Select rating
</option>

<option value="⭐">
⭐
</option>

<option value="⭐⭐">
⭐⭐
</option>

<option value="⭐⭐⭐">
⭐⭐⭐
</option>

<option value="⭐⭐⭐⭐">
⭐⭐⭐⭐
</option>

<option value="⭐⭐⭐⭐⭐">
⭐⭐⭐⭐⭐
</option>

</select>


<label for="pros">
Pros
</label>

<textarea
id="pros"
rows="5"
placeholder="What did you like?"
></textarea>


<label for="cons">
Cons
</label>

<textarea
id="cons"
rows="5"
placeholder="What didn't you like?"
></textarea>


<label for="worthPlaying">
Worth Playing?
</label>

<select id="worthPlaying">

<option value="">
Select an answer
</option>

<option value="Yes">
Yes
</option>

<option value="Maybe">
Maybe
</option>

<option value="No">
No
</option>

</select>

</div>


<div class="button-row">

<button
type="button"
class="back-btn"
onclick="backToStep2()"
>
← Back
</button>

<button
type="button"
class="next-btn"
onclick="goToStep4()"
>
Next →
</button>

</div>

</section>


<!-- =========================================================
     STEP 4
     ========================================================= -->

<section class="step" id="step4">

<h2>Step 4 • Publish</h2>


<div class="preview-box">

<h3 id="previewTitle">
Article Title
</h3>


<div class="preview-info">

<p>
<strong>Game:</strong>
<span id="previewGame"></span>
</p>


<p>
<strong>Category:</strong>
<span id="previewCategory"></span>
</p>


<p>
<strong>Device:</strong>
<span id="previewDevice"></span>
</p>


<p>
<strong>Video:</strong>
<span id="previewVideo"></span>
</p>

</div>


<h3>
<span id="previewSubject"></span>
</h3>


<p id="previewStory"></p>


<div
id="reviewPreview"
style="display:none;"
>

<h3>
⭐ Review
</h3>

<p>
<strong>Rating:</strong>
<span id="previewRating"></span>
</p>

<p>
<strong>Pros:</strong>
</p>

<p id="previewPros"></p>


<p>
<strong>Cons:</strong>
</p>

<p id="previewCons"></p>


<p>
<strong>Worth Playing:</strong>
<span id="previewWorth"></span>
</p>

</div>

</div>


<div class="button-row">

<button
type="button"
class="back-btn"
onclick="backToStep3()"
>
← Back
</button>


<button
type="button"
class="publish-btn"
onclick="publishArticle()"
>
🚀 Publish Article
</button>

</div>

</section>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>


// ============================================================
// WEB APP URL
// ============================================================

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbw0aCmOxJDqsZh-tZVJO8SR_JDszS8zWuAN8p2MfMM97NU0Abd_CJDgRnOMZZ_3D5D6/exec";


let currentStep = 1;


// ============================================================
// STARTUP
// ============================================================

window.addEventListener(
"DOMContentLoaded",
function () {

toggleReview();

updateProgress(1);

}
);


// ============================================================
// SHOW STEP
// ============================================================

function showStep(step) {


document.querySelectorAll(
".step"
).forEach(
function (page) {

page.classList.remove(
"active"
);

}
);


const target =
document.getElementById(
"step" + step
);


if (!target) {

alert(
"Could not open Step " +
step +
"."
);

return;

}


target.classList.add(
"active"
);


updateProgress(step);


currentStep = step;


window.scrollTo({

top: 0,

behavior: "smooth"

});

}


// ============================================================
// PROGRESS
// ============================================================

function updateProgress(step) {


const steps =
document.querySelectorAll(
".progress-step"
);


steps.forEach(
function (item, index) {


item.classList.remove(
"active",
"completed"
);


if (index < step - 1) {

item.classList.add(
"completed"
);

}
else if (index === step - 1) {

item.classList.add(
"active"
);

}

}
);

}


// ============================================================
// STEP 1 VALIDATION
// ============================================================

function nextStep() {


const title =
document.getElementById(
"articleTitle"
);


const game =
document.getElementById(
"gameName"
);


const category =
document.getElementById(
"category"
);


const video =
document.getElementById(
"videoLink"
);


if (!title.value.trim()) {

alert(
"Please enter an Article Title."
);

title.focus();

return;

}


if (!game.value.trim()) {

alert(
"Please enter the Game Name."
);

game.focus();

return;

}


if (!category.value) {

alert(
"Please select a Category."
);

category.focus();

return;

}


if (!video.value.trim()) {

alert(
"Please enter your Video Link."
);

video.focus();

return;

}


showStep(2);

}


// ============================================================
// STEP 2
// ============================================================

function goToStep3() {


const subject =
document.getElementById(
"subject"
);


const story =
document.getElementById(
"story"
);


if (!subject.value) {

alert(
"Please select a Subject."
);

subject.focus();

return;

}


if (!story.value.trim()) {

alert(
"Please describe your content."
);

story.focus();

return;

}


showStep(3);

}


// ============================================================
// REVIEW TOGGLE
// ============================================================

function toggleReview() {


const review =
document.getElementById(
"reviewSection"
);


const checkbox =
document.getElementById(
"reviewMode"
);


if (!review || !checkbox) {

return;

}


if (checkbox.checked) {

review.style.display =
"block";

}
else {

review.style.display =
"none";

}

}


// ============================================================
// BACK BUTTONS
// ============================================================

function previousStep() {

showStep(1);

}


function backToStep2() {

showStep(2);

}


function backToStep3() {

showStep(3);

}


// ============================================================
// STEP 4 PREVIEW
// ============================================================

function goToStep4() {


document.getElementById(
"previewTitle"
).innerText =
document.getElementById(
"articleTitle"
).value;


document.getElementById(
"previewGame"
).innerText =
document.getElementById(
"gameName"
).value;


document.getElementById(
"previewCategory"
).innerText =
document.getElementById(
"category"
).value;


document.getElementById(
"previewDevice"
).innerText =
document.getElementById(
"device"
).value ||
"Not specified";


document.getElementById(
"previewVideo"
).innerText =
document.getElementById(
"videoLink"
).value;


document.getElementById(
"previewSubject"
).innerText =
document.getElementById(
"subject"
).value;


document.getElementById(
"previewStory"
).innerText =
document.getElementById(
"story"
).value;


const reviewPreview =
document.getElementById(
"reviewPreview"
);


if (
document.getElementById(
"reviewMode"
).checked
) {


reviewPreview.style.display =
"block";


document.getElementById(
"previewRating"
).innerText =
document.getElementById(
"rating"
).value;


document.getElementById(
"previewPros"
).innerText =
document.getElementById(
"pros"
).value;


document.getElementById(
"previewCons"
).innerText =
document.getElementById(
"cons"
).value;


document.getElementById(
"previewWorth"
).innerText =
document.getElementById(
"worthPlaying"
).value;

}
else {


reviewPreview.style.display =
"none";

}


showStep(4);

}


// ============================================================
// READ THUMBNAIL
// ============================================================

function readThumbnail(file) {


return new Promise(
function (resolve, reject) {


if (!file) {

resolve({

data: "",

name: ""

});

return;

}


const reader =
new FileReader();


reader.onload =
function () {


resolve({

data:
reader.result,

name:
file.name

});

};


reader.onerror =
function () {


reject(
new Error(
"Could not read the thumbnail."
)
);

};


reader.readAsDataURL(
file
);

}
);

}


// ============================================================
// PUBLISH
// ============================================================

async function publishArticle() {


const publishButton =
document.querySelector(
".publish-btn"
);


const originalButtonText =
publishButton
?
publishButton.innerHTML
:
"🚀 Publish Article";


try {


const title =
document.getElementById(
"articleTitle"
).value.trim();


const thumbnailInput =
document.getElementById(
"thumbnail"
);


const game =
document.getElementById(
"gameName"
).value.trim();


const category =
document.getElementById(
"category"
).value;


const device =
document.getElementById(
"device"
).value.trim();


const video =
document.getElementById(
"videoLink"
).value.trim();


const subject =
document.getElementById(
"subject"
).value;


const story =
document.getElementById(
"story"
).value.trim();


const reviewMode =
document.getElementById(
"reviewMode"
).checked;


const rating =
document.getElementById(
"rating"
).value;


const pros =
document.getElementById(
"pros"
).value.trim();


const cons =
document.getElementById(
"cons"
).value.trim();


const worthPlaying =
document.getElementById(
"worthPlaying"
).value;


if (!title) {

alert(
"Please enter an Article Title."
);

return;

}


if (publishButton) {

publishButton.disabled =
true;

publishButton.innerHTML =
"⏳ Publishing...";

}


// ==========================================================
// THUMBNAIL
// ==========================================================

let thumbnail = "";

let thumbnailName = "";


if (
thumbnailInput &&
thumbnailInput.files.length > 0
) {


const image =
await readThumbnail(
thumbnailInput.files[0]
);


thumbnail =
image.data;


thumbnailName =
image.name;

}


// ==========================================================
// ARTICLE DATA
// ==========================================================

const articleData = {


title:
title,


thumbnail:
thumbnail,


thumbnailName:
thumbnailName,


game:
game,


category:
category,


device:
device,


video:
video,


subject:
subject,


story:
story,


reviewMode:
reviewMode,


rating:
rating,


pros:
pros,


cons:
cons,


worthPlaying:
worthPlaying

};


// ==========================================================
// SEND TO APPS SCRIPT
// ==========================================================

console.log(
"Sending article to Pluffino Publisher..."
);


const response =
await fetch(
WEB_APP_URL,
{

method:
"POST",


headers:
{

"Content-Type":
"text/plain;charset=utf-8"

},


body:
JSON.stringify(
articleData
)

}
);


const resultText =
await response.text();


console.log(
"Publisher response:",
resultText
);


let result = null;


try {

result =
JSON.parse(
resultText
);

}
catch (parseError) {

console.log(
"Response was not JSON."
);

}


if (
result &&
result.success === false
) {

throw new Error(
result.error ||
"The publisher returned an error."
);

}


alert(
"🎉 Article published successfully!"
);


}
catch (error) {


console.error(
"Publish error:",
error
);


alert(

"❌ Publishing failed.\n\n" +

(
error.message ||
"Please try again."
)

);


}
finally {


if (publishButton) {

publishButton.disabled =
false;

publishButton.innerHTML =
originalButtonText;

}

}

}

</script>

</body>

</html>

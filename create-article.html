<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluffino Studio</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="creator-container">

<h1>🚀 Pluffino Studio</h1>

<p class="subtitle">
Create a brand new article for Pluffino Gaming Hub
</p>

<!-- Progress Bar -->

<div class="progress-container">

<div class="progress-step active">
<div class="circle">1</div>
<span>Basic Info</span>
</div>

<div class="line"></div>

<div class="progress-step">
<div class="circle">2</div>
<span>Content</span>
</div>

<div class="line"></div>

<div class="progress-step">
<div class="circle">3</div>
<span>Details</span>
</div>

<div class="line"></div>

<div class="progress-step">
<div class="circle">4</div>
<span>Publish</span>
</div>

</div>

<!-- ========================= -->
<!-- STEP 1 -->
<!-- ========================= -->

<div class="step active" id="step1">

<div class="step-box">

<h2>Step 1 • Basic Information</h2>

<label>🖼 Thumbnail</label>

<input id="thumbnail" type="file">

<label>📝 Article Title</label>

<input
id="articleTitle"
type="text"
placeholder="Example: Lokicraft 7 Review">

<label>🎮 Game Name</label>

<input
id="gameName"
type="text"
placeholder="Lokicraft 7">

<label>📂 Category</label>

<select id="category">

<option value="">Select Category</option>

<option>Action</option>
<option>Adventure</option>
<option>Battle Royale</option>
<option>Building & Sandbox</option>
<option>Casual</option>
<option>Fighting</option>
<option>Horror</option>
<option>Open World</option>
<option>Puzzle</option>
<option>Racing</option>
<option>RPG</option>
<option>Shooter</option>
<option>Simulation</option>
<option>Sports</option>
<option>Strategy</option>
<option>Survival</option>
<option>Other</option>

</select>

<label>📱 Device (Optional)</label>

<input
id="device"
type="text"
placeholder="Samsung Galaxy A15">

<label>▶ Video Link</label>

<input
id="videoLink"
type="url"
placeholder="https://youtube.com/...">

<div class="buttons">

<button
class="next-btn"
onclick="nextStep()">

Next →

</button>

</div>

</div>

</div>

<!-- ========================= -->
<!-- STEP 2 -->
<!-- ========================= -->

<div class="step" id="step2">

<div class="step-box">

<h2>Step 2 • Content</h2>

<label>📂 Subject</label>

<select id="subject">

<option value="">Select Subject</option>

<option>Review</option>
<option>Gameplay</option>
<option>Tutorial</option>
<option>Tips & Tricks</option>
<option>Challenge</option>
<option>Crate Opening</option>
<option>Bugs & Glitches</option>
<option>Comparison</option>
<option>News</option>
<option>Other</option>

</select>

<label>✍ Describe It</label>

<textarea
id="story"
rows="10"
placeholder="Describe your experience..."></textarea>

<div class="buttons">

<button
class="back-btn"
onclick="previousStep()">

← Back

</button>

<button
class="next-btn"
onclick="goToStep3()">

Next →

</button>

</div>

</div>

</div>

<!-- ========================= -->
<!-- STEP 3 -->
<!-- ========================= -->

<div class="step" id="step3">

<div class="step-box">

<h2>Step 3 • Article Details</h2>

<label>

<input
type="checkbox"
id="reviewMode"
onchange="toggleReview()">

This is a Review Article

</label>

<div id="reviewSection">

<label>⭐ Overall Rating</label>

<select id="rating">

<option value="">Select Rating</option>

<option>⭐☆☆☆☆ (1/5)</option>
<option>⭐⭐☆☆☆ (2/5)</option>
<option>⭐⭐⭐☆☆ (3/5)</option>
<option>⭐⭐⭐⭐☆ (4/5)</option>
<option>⭐⭐⭐⭐⭐ (5/5)</option>

</select>

<label>✅ Pros</label>

<textarea
id="pros"
rows="5"></textarea>

<label>❌ Cons</label>

<textarea
id="cons"
rows="5"></textarea>

<label>🎮 Worth Playing?</label>

<select id="worthPlaying">

<option>Yes</option>
<option>No</option>
<option>Depends</option>

</select>

</div>

<div class="buttons">

<button
class="back-btn"
onclick="backToStep2()">

← Back

</button>

<button
class="next-btn"
onclick="goToStep4()">

Next →

</button>

</div>

</div>

</div>

<!-- ========================= -->
<!-- STEP 4 -->
<!-- ========================= -->

<div class="step" id="step4">

<div class="step-box">

<h2>🎉 Preview & Publish</h2>

<p>

Phase 4 will generate the article preview here.

</p>

<div class="buttons">

<button
class="back-btn"
onclick="backToStep3()">

← Back

</button>

<button
class="publish-btn">

🚀 Publish Article

</button>

</div>

</div>

</div>

</div>

<!-- JavaScript goes here in Part 3 -->

</body>

    </html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluffino Studio - Create Article</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="creator-container">

    <h1>🚀 Pluffino Studio</h1>

    <p class="subtitle">
        Create a brand new article for Pluffino Gaming Hub
    </p>
<div class="progress-container">

    <div class="progress-step active">
        <div class="circle">1</div>
        <span>Basic Info</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">2</div>
        <span>Write</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">3</div>
        <span>Ratings</span>
    </div>

    <div class="line"></div>

    <div class="progress-step">
        <div class="circle">4</div>
        <span>Preview</span>
    </div>

</div>
    <div class="step active" id="step1">
<div class="step-box">
<div class="success-message" id="successMessage">

✅ Basic Information Complete!

Moving to Content...

</div>
        <h2>Step 1 • Basic Information</h2>

        <label>🖼 Thumbnail</label>
        <input type="file">

        <label>📝 Article Title</label>
        <input type="text" placeholder="Example: Lokicraft 7 Review">

        <label>🎮 Game Name</label>
        <input type="text" placeholder="Lokicraft 7">

        <label>📂 Category</label>

<select>

    <option>Action</option>

    <option>Adventure</option>

    <option>Battle Royale</option>

    <option>Building & Sandbox</option>

    <option>Casual</option>

    <option>Fighting</option>

    <option>Horror</option>

    <option>Open World</option>

    <option>Puzzle</option>

    <option>Racing</option>

    <option>RPG</option>

    <option>Shooter</option>

    <option>Simulation</option>

    <option>Sports</option>

    <option>Strategy</option>

    <option>Survival</option>

    <option>Other</option>

</select>

        <label>📱 Device (Optional)</label>
        <input type="text" placeholder="Samsung Galaxy A15">

        <label>▶ YouTube Video Link</label>
        <input type="url" placeholder="https://youtube.com/...">
    </div>
    <script>

function nextStep(){

const title=document.querySelector('input[placeholder="Example: Lokicraft 7 Review"]');

const game=document.querySelector('input[placeholder="Lokicraft 7"]');

const video=document.querySelector('input[type="url"]');

if(title.value==""){

alert("Please enter an Article Title.");

return;

}

if(game.value==""){

alert("Please enter the Game Name.");

return;

}

if(video.value==""){

alert("Please enter your YouTube Video Link.");

return;

}

document.getElementById("successMessage").style.display="block";

setTimeout(function(){

document.getElementById("successMessage").style.display="none";

document.getElementById("step1").classList.remove("active");

document.getElementById("step2").classList.add("active");

updateProgress(2);

},700);

}

function previousStep(){

document.getElementById("step2").classList.remove("active");

document.getElementById("step1").classList.add("active");

updateProgress(1);

}

function updateProgress(step){

const steps=document.querySelectorAll(".progress-step");

steps.forEach((item,index)=>{

item.classList.remove("active");

if(index<step){

item.classList.add("active");

}

});

}

</script>
    </div>
<div class="step" id="step2">

<div class="step-box">

<h2>Step 2 • Content</h2>

<label>📂 Subject</label>

<select id="subject">

<option value="">Select Subject</option>

<option>Review</option>
<option>Gameplay</option>
<option>Tutorial</option>
<option>Tips & Tricks</option>
<option>Challenge</option>
<option>Crate Opening</option>
<option>Bugs & Glitches</option>
<option>Comparison</option>
<option>News</option>
<option>Other</option>

</select>

<label>✍ Tell Your Story</label>

<textarea id="story"></textarea>

<div class="buttons">

<button class="back-btn" onclick="previousStep()">
← Back
</button>

<button class="next-btn" onclick="nextStep()">
Next →
</button>

</div>

</div>

</div>
